
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Saisie des notes</title>
</head>
<body>
    <h1>Saisir les notes d'un apprenant</h1>

    <form action="traitement.php" method="POST">
        <label>Nom :
            <input type="text" name="nom" required>
        </label><br><br>

        <label>Note Informatique :
            <input type="number" name="note_info"
                   min="0" max="20" step="0.01" required>
        </label><br><br>

        <label>Note Mathématiques :
            <input type="number" name="note_math"
                   min="0" max="20" step="0.01" required>
        </label><br><br>

        <button type="submit">Enregistrer</button>
    </form>
</body>
</html>
